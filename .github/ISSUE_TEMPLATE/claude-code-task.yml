name: "Task untuk Claude Code (server/**, ai-service/**)"
description: Satu task backend / ai-service. Satu issue = satu branch = satu PR.
title: "[server] "
labels: ["agent:claude-code"]
body:
  - type: markdown
    attributes:
      value: |
        Sebelum isi ini, pastikan sudah baca `AGENTS.md §0` urutan wajib.
        Kalau task menyentuh DB, cek `ERD.md` dulu.
  - type: textarea
    id: goal
    attributes:
      label: Tujuan task
      description: Satu-dua kalimat, merujuk ke bagian SPEC.md yang relevan.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Salin dari SPEC.md / TESTING.md kalau ada (contoh nomor skenario E-xx).
      placeholder: |
        - [ ] ...
        - [ ] Test: E16 (double-booking konkuren) lulus
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: File yang boleh diubah
      description: Daftar file/folder eksplisit. Di luar ini dianggap keluar scope.
      placeholder: "server/services/availabilityService.js, server/__tests__/unit/availabilityService.test.js"
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Pengingat batasan (AGENTS.md §1b)
      options:
        - label: Tidak membuat tabel/kolom/cache Slots
        - label: Tidak mencegah double-booking dengan findOne lalu create
        - label: Tidak menulis if (user.role === ...) di luar accessService.js
        - label: Tidak menerbitkan URL dokumen tanpa DocumentAccessLogs
        - label: Tidak mengirim teks dokumen ke LLM tanpa lewat deidentify.py
        - label: Tidak menulis new Date() di dalam service (pakai dateHelper.now())
