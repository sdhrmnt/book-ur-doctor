name: "Task untuk Cline (client/**)"
description: Satu task frontend. Satu issue = satu branch = satu PR.
title: "[client] "
labels: ["agent:cline"]
body:
  - type: markdown
    attributes:
      value: |
        Kontrak API ada di `ARCHITECTURE.md §3` dan `§4`. Jangan mengarang
        field response yang tidak tercantum di sana.
  - type: textarea
    id: goal
    attributes:
      label: Tujuan task
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Halaman punya test 4 keadaan: loading, kosong, error, sukses
        - [ ] ...
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: File yang boleh diubah
      placeholder: "client/src/pages/Booking.jsx, client/src/components/SlotPicker.jsx"
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint yang dipakai (kalau ada)
      description: Sebut nomor bagian di ARCHITECTURE.md §4
      placeholder: "GET /api/availability (ARCHITECTURE.md §4b)"
  - type: checkboxes
    id: constraints
    attributes:
      label: Pengingat batasan
      options:
        - label: Tidak menambah state library baru (Redux/Zustand/React Query)
        - label: Tidak menambah UI library baru
        - label: Ringkasan AI yang ditampilkan selalu ada disclaimer
        - label: Signed URL dokumen tidak disimpan di localStorage / state yang bertahan lintas halaman
